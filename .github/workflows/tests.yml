# 每次推送和 PR 更新都运行同一组检查，方便小组成员确认自己的修改没有破坏时序。
name: Causal backtest regression tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      # 取出当前提交，并安装与项目默认一致的 Python 主次版本。
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # CI 检查声明的兼容依赖；复核随仓库数值时可使用 requirements-lock.txt。
      - run: python -m pip install -r requirements.txt
      # 单元与合成数据端到端测试：验证因果性、资金守恒、奖励匹配和可重复性。
      - run: python -m unittest discover -s tests -v
      # 再用真实数据的小窗口检查入口可运行；另存 /tmp，不覆盖正式实验产物。
      - run: python run_experiments.py --rows 3000 --windows 1 --output /tmp/smoke.json
      # 报告和看板都必须能消费这一份新结果，避免输出结构变化后展示代码失效。
      - run: python generate_report.py --input /tmp/smoke.json --output /tmp/report.md
      - run: python generate_dashboard.py --input /tmp/smoke.json --output /tmp/dashboard.html
