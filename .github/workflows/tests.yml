# 课程版只检查证据与必要合成性质，不下载行情或重训季度数据。
name: Course project checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -S scripts/check_project.py
      - run: python -m pip install -r requirements.txt
      - run: python run_project.py check --core
